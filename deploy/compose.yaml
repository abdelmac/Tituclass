name: medclass
services:
  app:
    build:
      context: ..
    image: medclass:local
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: https://${MEDCLASS_DOMAIN:?Set MEDCLASS_DOMAIN in deploy/.env}
      NODE_ENV: production
      COOKIE_SECURE: "true"
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/medclass.sqlite
    volumes:
      - database:/app/data
    expose:
      - "3000"
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MEDCLASS_DOMAIN: ${MEDCLASS_DOMAIN:?Set MEDCLASS_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backups:
    image: medclass:local
    restart: unless-stopped
    init: true
    command: ["node", "scripts/backup-loop.js"]
    environment:
      DATABASE_PATH: /app/data/medclass.sqlite
      BACKUP_PATH: /app/backups
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_INTERVAL_HOURS: "6"
    volumes:
      - database:/app/data
      - backups:/app/backups
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  database:
  backups:
  certificates:
  caddy-config:
